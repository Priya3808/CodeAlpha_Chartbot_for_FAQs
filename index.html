<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FAQ Chatbot</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>FAQ Chatbot (Simple)</h1>

    <label for="question">Ask a question about the internship or project:</label>
    <textarea id="question" rows="4" placeholder="Type your question here..."></textarea>
    <button id="askBtn">Ask</button>

    <div id="result" class="card" style="display:none;">
      <h3>Answer</h3>
      <div id="answerText"></div>
      <div id="confidence"></div>
    </div>

    <h3>Example FAQs (you can ask)</h3>
    <ul>
      <li>What is CodeAlpha internship?</li>
      <li>How do I submit my project?</li>
      <li>Which languages are supported?</li>
      <li>How do I run the projects?</li>
    </ul>
  </div>

<script>
document.getElementById('askBtn').addEventListener('click', async () => {
  const text = document.getElementById('question').value.trim();
  if (!text) { alert('Please type a question.'); return; }

  const res = await fetch('/ask', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text})
  });

  const data = await res.json();
  if (!data.ok) {
    alert('Error: ' + (data.error || 'unknown'));
    return;
  }

  document.getElementById('result').style.display = 'block';
  document.getElementById('answerText').innerText = data.answer;
  document.getElementById('confidence').innerText = 'Confidence: ' + (data.score ?? 0);
});
</script>
</body>
</html>
